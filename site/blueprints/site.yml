title: Sito
tabs:
  pagine:
    label: Pagine
    icon: page
    sections:
      pagine:
        type: pages
        headline: Pagine
        status: all
        create: false
  generale:
    label: Generale
    icon: settings
    fields:
      nome_esteso:
        label: Nome esteso del progetto
        type: text
        help: Sotto "Happy", nella hero e nel piè di pagina
      partecipa_testo:
        label: Testo del bottone "Partecipa"
        type: text
        width: 1/2
      partecipa_link:
        label: Link al modulo
        type: url
        help: Il modulo di iscrizione (Qualtrics della SUPSI). Senza link il bottone non compare
        width: 1/2
  piede:
    label: Piè di pagina
    icon: text
    fields:
      piede_titolari_etichetta:
        label: Titolari
        type: text
        placeholder: Un progetto di
        width: 1/3
      piede_titolari:
        extends: fields/loghi
        label: Loghi dei titolari
        width: 2/3
      piede_contributo_etichetta:
        label: Contributo
        type: text
        placeholder: Contributo
        width: 1/3
      piede_contributo_testo:
        label: Testo del contributo
        type: textarea
        size: small
        buttons: false
        width: 2/3
      piede_contributo_logo:
        extends: fields/loghi
        label: Logo del finanziatore
        max: 1
      piede_partner_etichetta:
        label: Partner
        type: text
        placeholder: In collaborazione con
        width: 1/3
      piede_partner:
        extends: fields/loghi
        label: Loghi dei partner
        width: 2/3
      piede_link:
        label: Link
        type: structure
        help: Per esempio privacy e accessibilità. Senza indirizzo il testo resta semplice testo
        columns:
          testo:
            width: 1/2
          link:
            width: 1/2
        fields:
          testo:
            label: Testo
            type: text
            required: true
          link:
            label: Indirizzo
            type: link
            options:
              - url
              - page
      piede_copyright:
        label: Copyright
        type: text
