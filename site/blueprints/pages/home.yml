title: Home
# La parte alta della home: logo (fisso, è un SVG), mascotte, video e la presentazione "Cos'è Happy?"
columns:
  hero:
    width: 1/3
    fields:
      illustrazione: fields/illustrazione
      video:
        label: Video
        type: files
        max: 1
        query: page.videos
        uploads: video
        help: MP4 (H.264) compresso, in 16:9. Se il pannello non lo accetta perché è troppo pesante, caricalo con FileZilla in content/home e poi sceglilo qui
      sottotitoli:
        label: Sottotitoli del video
        type: files
        max: 1
        query: page.files.filterBy('extension', 'vtt')
        uploads: sottotitoli
        help: File .vtt in italiano. Senza sottotitoli il video non compare e resta l'immagine
      copertina:
        extends: fields/illustrazione
        label: Immagine del video
        help: In formato 16:9. È la copertina del video finché non si preme play; senza video prende il suo posto. Il testo alternativo descrive l'immagine
      video_crediti:
        label: Descrizione del video
        type: textarea
        size: small
        buttons:
          - link
        help: Sotto il video, come la descrizione di YouTube (crediti, musica, link del questionario). Ogni riga va a capo. Se cambia il link del questionario, cambialo anche in Sito → Generale
  presentazione:
    width: 2/3
    fields:
      presentazione_titolo:
        label: Titolo della presentazione
        type: text
        width: 1/2
      voce_menu: fields/voce-menu
      presentazione_testo:
        label: Testo della presentazione
        type: textarea
        size: medium
  sezioni:
    width: 1/1
    sections:
      sezioni:
        type: pages
        headline: Sezioni
        help: L'ordine qui è l'ordine sulla pagina. Si vedono solo le sezioni pubblicate
        status: all
        templates:
          - sezione
          - destinatari
          - fasi
          - ricerca
          - team
          - contatti
