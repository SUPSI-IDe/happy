title: Tema della ricerca
# Una tendina della Ricerca: lo strumento disegnato, il titolo e l'anteprima si vedono sempre; il resto
# del testo e i riferimenti si vedono aprendo la tendina
fields:
  illustrazione:
    extends: fields/illustrazione
    label: Strumento
    help: Decorativo, trasparente, al doppio della misura con cui compare
  anteprima:
    label: Anteprima
    type: textarea
    size: small
    buttons: false
    help: La prima frase, sempre visibile anche con la tendina chiusa
  testo:
    label: Continuazione
    type: textarea
    size: small
    buttons: false
    help: Il resto del testo, che compare aprendo la tendina subito dopo l'anteprima. Può restare vuoto
  riferimenti:
    label: Riferimenti
    type: structure
    help: Trascina per cambiare l'ordine
    columns:
      autori:
        width: 1/3
      titolo:
        width: 2/3
    fields:
      autori:
        label: Autori e anno
        type: text
        placeholder: "Cruder, C., Barbero, M. (2020)."
        required: true
      titolo:
        label: Titolo dell'articolo
        type: text
        required: true
      link:
        label: Link (DOI)
        type: url
        help: Diventa il link sul titolo
      fonte:
        label: Rivista, volume, pagine
        type: text
        placeholder: "PLoS One, 15(12), e0242660."
