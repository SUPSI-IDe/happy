title: Video del Toolkit
# Pagina dei partner: possono crearla, modificarla ed eliminarla
num: date
status:
  draft: Bozza
  listed: Pubblicato
fields:
  descrizione:
    label: Descrizione
    type: textarea
    size: small
  strumento:
    label: Strumento
    type: tags
    width: 1/2
  parte_del_corpo:
    label: Parte del corpo
    type: tags
    width: 1/2
  profilo:
    label: Profilo di riferimento
    type: checkboxes
    columns: 3
    options:
      insegnanti: Insegnanti
      famiglie: Famiglie
      professionisti: Professionisti
  durata:
    label: Durata
    type: text
    placeholder: "3:45"
    width: 1/4
  link_video:
    label: Link al video
    type: url
    required: true
    width: 3/4
  trascrizione:
    label: Sottotitoli o trascrizione
    type: textarea
    size: large
    help: Obbligatoria per l'accessibilità
